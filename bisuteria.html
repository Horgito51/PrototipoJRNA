<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bisutería — Inspiración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-store="bisuteria">
  <header class="topbar">
    <div class="container-app topbar-inner">
      <a class="icon-btn" href="index.html" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </a>

      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.1 6.5H21l-5.3 3.9 2 6.6L12 16.8 6.3 20l2-6.6L3 9.5h6.9L12 3z"/></svg>
        </span>
        <p class="brand-name">Inspiración</p>
      </a>

      <div class="store-tabs">
        <a class="pill is-active" href="bisuteria.html">Bisutería</a>
        <a class="pill pill-muted" href="regalos.html">Regalos</a>
      </div>

      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="catalog-search" placeholder="Buscar producto..." autocomplete="off">
      </label>

      <button type="button" class="btn-upload" data-open-upload>+ Subir</button>
    </div>
  </header>

  <main class="container-app catalog-section">
    <div class="filter-row" id="category-filters" aria-label="Filtros">
      <button type="button" class="filter-chip is-active" data-category="todas">Todo</button>
      <button type="button" class="filter-chip" data-category="joyas">Joyas</button>
      <button type="button" class="filter-chip" data-category="pulseras">Pulseras</button>
      <button type="button" class="filter-chip" data-category="dijes">Dijes</button>
      <button type="button" class="filter-chip" data-category="llaveros">Llaveros</button>
      <button type="button" class="filter-chip" data-category="cristales">Cristales</button>
      <button type="button" class="filter-chip" data-category="perlas">Perlas</button>
      <button type="button" class="filter-chip" data-category="hilo">Hilo</button>
    </div>

    <h1 class="catalog-heading">Bisutería</h1>
    <p class="catalog-count" id="catalog-count">0 productos</p>
    <div class="product-grid" id="product-grid"></div>
    <p class="catalog-empty is-hidden" id="catalog-empty">No se encontraron productos.</p>
  </main>

  <button type="button" class="help-fab" aria-label="Ayuda">?</button>

  <div class="modal-backdrop" id="upload-modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="upload-title">
      <div class="modal-header">
        <h2 id="upload-title">Subir producto</h2>
        <button type="button" class="modal-close" data-close-upload aria-label="Cerrar">×</button>
      </div>
      <form id="upload-form">
        <label class="upload-drop" for="upload-image">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong>Arrastra una imagen aquí</strong>
          <span>o haz clic para seleccionar</span>
        </label>
        <input type="file" id="upload-image" accept="image/*" class="is-hidden">
        <span class="field-label">Categoría</span>
        <div class="modal-cats">
          <button type="button" class="modal-cat is-active" data-upload-store="bisuteria">Bisutería</button>
          <button type="button" class="modal-cat" data-upload-store="regalos">Regalos</button>
        </div>
        <label class="field-label" for="upload-name">Nombre del producto</label>
        <input class="modal-input" id="upload-name" type="text" placeholder="Ej. Collar dorado artesanal" required>
        <button type="submit" class="btn-publish">Publicar producto</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
