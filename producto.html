<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Inspiración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container-app detail-page" id="detail-page">
    <div class="detail-top">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <a class="icon-btn" id="detail-back" href="bisuteria.html" aria-label="Volver">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3l2.1 6.5H21l-5.3 3.9 2 6.6L12 16.8 6.3 20l2-6.6L3 9.5h6.9L12 3z"/></svg>
          </span>
          <p class="brand-name">Inspiración</p>
        </a>
      </div>
      <span class="pill pill-muted" id="detail-tag">Producto</span>
    </div>

    <div class="detail-layout">
      <section>
        <div class="gallery-main">
          <img id="detail-image" src="" alt="">
        </div>
        <div class="gallery-thumbs" id="detail-thumbs"></div>
      </section>

      <section>
        <p class="detail-eyebrow" id="detail-eyebrow">Bisutería</p>
        <h1 class="detail-title" id="detail-title">Producto</h1>
        <p class="detail-price" id="detail-price">$0</p>
        <p class="detail-copy" id="detail-description"></p>
        <p class="detail-material" id="detail-material"></p>
        <p class="detail-stock" id="detail-stock">En stock</p>

        <div class="qty-box">
          <span>Cantidad:</span>
          <div class="qty-controls">
            <button type="button" id="qty-minus" aria-label="Menos">−</button>
            <span id="qty-value">1</span>
            <button type="button" id="qty-plus" aria-label="Más">+</button>
          </div>
        </div>

        <div class="detail-actions">
          <button type="button" class="btn-primary" id="btn-add-cart">Añadir al carrito</button>
          <button type="button" class="btn-secondary" id="btn-save">Guardar</button>
        </div>

        <div class="related-block">
          <h3>También te puede gustar</h3>
          <div class="related-grid" id="related-grid"></div>
        </div>
      </section>
    </div>
  </main>

  <button type="button" class="help-fab" aria-label="Ayuda">?</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
